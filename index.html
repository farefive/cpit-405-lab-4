<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Auto Parts - Order Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .container {
            width: 520px;
            margin: 10px auto;
        }

        h1 {
            text-align: center;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
        }

        label {
            display: block;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            margin-top: 2px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
        }

        input {
            height: 38px;
        }

        textarea {
            height: 220px;
            resize: vertical;
        }

        button {
            width: 100%;
            height: 38px;
            margin-top: 3px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Great Auto Parts - Order Form</h1>

        <form>

            <label for="firstName">First Name:</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter your first name"
            >

            <label for="lastName">Last Name:</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter your last name"
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
            >

            <label for="phone">Phone number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >

            <label for="make">Make:</label>
            <input
                type="text"
                id="make"
                name="make"
                placeholder="Make"
            >

            <label for="model">Model:</label>
            <input
                type="text"
                id="model"
                name="model"
                placeholder="Model"
            >

            <label for="year">Year:</label>
            <input
                type="number"
                id="year"
                name="year"
                placeholder="Year"
            >

            <label for="date">Date:</label>
            <input
                type="date"
                id="date"
                name="date"
            >

            <label for="sparePart">Spare Part:</label>
            <input
                type="text"
                id="sparePart"
                name="sparePart"
                placeholder="Enter the spare part you need"
            >

            <label for="quantity">Quantity:</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                placeholder="Enter the quantity of the spare part you need"
            >

            <label for="comment">Comment:</label>
            <textarea
                id="comment"
                name="comment"
                placeholder="Enter your comment"
            ></textarea>

            <button type="submit">Submit</button>

        </form>
    </div>

</body>
</html>
